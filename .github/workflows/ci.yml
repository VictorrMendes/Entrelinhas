name: CI

on:
  push:
    branches: [master, homolog]
  pull_request:
    branches: [master, homolog]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint + formatação numa passada só (Biome)
      - name: Lint and format
        run: npx biome ci .

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      # a mesma imagem que roda no servidor: pega Dockerfile quebrado antes do deploy
      - name: Docker build
        run: docker build -t entrelinhas-api:ci .

  # o PWA: a imagem do servidor já roda o tsc e o build do Vite
  web:
    name: Web (PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Docker build
        run: docker build -t entrelinhas-web:ci web

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # lint do Android + testes unitários (parser de livros, Leitner, ofensiva, mesclagem da sincronização)
      # e um build de verdade; o APK de release (com R8) sai no workflow Android
      - name: Lint, tests and build
        # chmod: o bit de execução do gradlew se perde quando o commit sai do Windows
        run: chmod +x gradlew && ./gradlew lintDebug testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 7
