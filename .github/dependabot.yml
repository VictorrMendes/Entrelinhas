version: 2
updates:
  # actions do CI: mantém as versões válidas e atualizadas
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]

  # imagem base do container (node:24-alpine): correções de segurança do Node e do Alpine
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # só versões LTS do Node (pares): a troca de major é manual, quando a próxima LTS sair
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        update-types: [minor, patch]
