# Security headers for every response. nginx drops the server's add_header in a location that sets its own, so each such
# location includes this file again.

# Only this site's own scripts, workers and fonts; images also from blobs (book pictures, covers) and Gutenberg's covers;
# no plugins, no framing. React sets styles through the DOM, so no inline styles are needed either.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://www.gutenberg.org; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Gutenberg's covers load without telling it which page asked
add_header Referrer-Policy "same-origin" always;
# the microphone is used for pronunciation; nothing else
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# browsers only honour it over https, which Cloudflare provides
add_header Strict-Transport-Security "max-age=31536000" always;
