server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # the API, from the api container of the same compose: the PWA calls /api/... on its own origin, so no CORS
    location /api/ {
        proxy_pass http://api:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # book files sync up to 80 MB; translations can take ~45 s when the models are slow
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }

    # Vite's hashed files never change; the rest is checked on every load so a deploy shows up at once
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";

        # the pdf.js worker keeps its .mjs name, which nginx's mime.types doesn't know; a module worker must be JavaScript
        location ~ \.mjs$ {
            types {}
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
    }
}
