server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # the API, from the api container of the same compose: the PWA calls /api/... on its own origin, so no CORS
    location /api/ {
        proxy_pass http://api:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # book files sync up to 80 MB; translations can take ~45 s when the models are slow
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }

    # Project Gutenberg for the catalog in Livros grátis (gutenberg.ts): only its search feed and its book files, so this
    # is no open proxy. The address is resolved when asked (Docker's DNS), so nginx starts even without internet.
    location ~ ^/gutenberg/(ebooks/search\.opds/|ebooks/\d+\.epub3\.images$|cache/epub/\d+/[\w.-]+\.epub$) {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=300s;
        set $gutenberg https://www.gutenberg.org;
        rewrite ^/gutenberg(/.*)$ $1 break;
        proxy_pass $gutenberg;
        proxy_ssl_server_name on;
        proxy_set_header Host www.gutenberg.org;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # the book's address redirects to its file, which must come through here too (a relative address: behind
        # Cloudflare nginx sees neither the https nor the real host)
        proxy_redirect https://www.gutenberg.org/ /gutenberg/;
        absolute_redirect off;
        proxy_read_timeout 60s;
    }

    # Vite's hashed files never change; the rest is checked on every load so a deploy shows up at once
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";

        # the pdf.js worker keeps its .mjs name, which nginx's mime.types doesn't know; a module worker must be JavaScript
        location ~ \.mjs$ {
            types {}
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
    }
}
