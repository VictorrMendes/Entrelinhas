server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    # the API, from the api container of the same compose: the PWA calls /api/... on its own origin, so no CORS
    location /api/ {
        proxy_pass http://api:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # book files sync up to 80 MB; translations can take ~45 s when the models are slow, and a big PDF as long to read
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }

    # Project Gutenberg's catalog in Livros grátis (gutenberg.ts): only its search feed, so this is no open proxy (the API
    # downloads the books). The address is resolved when asked (Docker's DNS), so nginx starts even without internet.
    location /gutenberg/ebooks/search.opds/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=300s;
        set $gutenberg https://www.gutenberg.org;
        rewrite ^/gutenberg(/.*)$ $1 break;
        proxy_pass $gutenberg;
        proxy_ssl_server_name on;
        proxy_set_header Host www.gutenberg.org;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # this site's own HSTS (security-headers.conf) is the one that counts
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 60s;
    }

    # Vite's hashed files never change; the rest is checked on every load so a deploy shows up at once
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
